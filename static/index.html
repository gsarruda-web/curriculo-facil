<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Currículo Fácil</title>
<style>
:root{--ink:#111827;--muted:#667085;--line:#d0d5dd;--bg:#f2f4f7;--card:#fff;--soft:#f8fafc;--ok:#027a48}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:var(--ink)}.wrap{max-width:680px;margin:auto;padding:22px 16px 40px}.card{background:var(--card);border-radius:18px;padding:26px;box-shadow:0 10px 32px #10182812}.brand{font-weight:800;font-size:25px}.sub{color:var(--muted);margin-top:6px;line-height:1.4}.progress{height:7px;background:#eaecf0;border-radius:20px;margin:22px 0}.bar{height:100%;width:4%;background:var(--ink);border-radius:20px;transition:.2s}label.main{display:block;font-size:22px;font-weight:700;margin:8px 0 16px;line-height:1.25}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:16px;background:white;color:var(--ink)}textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:13px 17px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--ink);color:white}.secondary{background:#eaecf0;color:var(--ink)}.danger{background:#fef3f2;color:#b42318}.help{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.count{font-size:13px;color:var(--ok);font-weight:700;margin-top:10px}.review-section{background:var(--soft);border:1px solid #eaecf0;border-radius:12px;padding:14px;margin:9px 0}.review-title{font-weight:800;margin-bottom:7px}.review-item{font-size:14px;line-height:1.5;color:#344054}.consent{display:flex;gap:10px;align-items:flex-start;margin-top:15px}.consent input{width:auto;margin-top:3px}.consent label{font-size:14px;line-height:1.45;color:#344054}.privacy{color:#344054}.done{text-align:center;padding:15px 0}.done h2{font-size:23px}.spinner{display:none;margin-top:12px;color:var(--muted);font-size:14px}.note{background:#fffaeb;border:1px solid #fedf89;padding:12px;border-radius:10px;font-size:13px;line-height:1.45;color:#7a2e0e}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 10px;font-size:13px;cursor:pointer}
@media(max-width:520px){.card{padding:21px 17px}.row{grid-template-columns:1fr}label.main{font-size:20px}.btn{flex:1}.actions .secondary{min-width:100px}}
</style></head>
<body><div class="wrap"><div class="card"><div class="brand">Currículo Fácil</div><div class="sub">Responda uma pergunta por vez. No final, seu currículo será montado no modelo profissional em Word.</div><div class="progress"><div class="bar" id="bar"></div></div><div id="area"></div></div></div>
<script>
const state={formacao:[],cursos:[],experiencias:[],habilidades:[]};
let idx=0;
const steps=[
 {id:'inicio',custom:'inicio'},
 {id:'nome_completo',q:'Qual é o seu nome completo?',req:1},
 {id:'cidade_uf',q:'Em qual cidade e estado você mora?',help:'Ex.: Barreiras-BA',req:1},
 {id:'endereco',q:'Deseja colocar seu endereço no currículo?',help:'É opcional. Cidade e estado normalmente são suficientes.'},
 {id:'telefone',q:'Qual é o seu telefone/WhatsApp?',req:1,help:'Ex.: (77) 9.9999-9999'},
 {id:'email',q:'Qual é o seu e-mail?',help:'Se não possuir, pode deixar em branco.'},
 {id:'cargo_objetivo',q:'Qual emprego, cargo ou área você procura?',req:1,help:'Ex.: Professora de Geografia, Auxiliar Administrativo, Atendente.'},
 {id:'formacao',custom:'formacao'},
 {id:'cursos',custom:'cursos'},
 {id:'experiencias',custom:'experiencias'},
 {id:'habilidades',q:'Quais habilidades melhor descrevem você?',help:'Separe por vírgulas. Ex.: organização, responsabilidade, comunicação, trabalho em equipe'},
 {id:'perfil_profissional',q:'Quer acrescentar algo específico ao perfil profissional?',help:'Se deixar em branco, o sistema cria um texto profissional automaticamente.',textarea:1},
 {id:'objetivo',q:'Quer escrever um objetivo profissional específico?',help:'Se deixar em branco, o sistema cria automaticamente.',textarea:1},
 {id:'revisao',custom:'review'}
];
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function setProgress(){document.getElementById('bar').style.width=((idx+1)/steps.length*100)+'%'}
function navButtons(nextLabel='Continuar'){return `<div class="actions">${idx>1?'<button class="btn secondary" onclick="back()">Voltar</button>':''}<button class="btn primary" onclick="next()">${nextLabel}</button></div>`}
function render(){setProgress();const s=steps[idx],a=document.getElementById('area');
 if(s.custom==='inicio')return inicioUI(a);
 if(s.custom==='formacao')return formacaoUI(a);
 if(s.custom==='cursos')return cursosUI(a);
 if(s.custom==='experiencias')return expUI(a);
 if(s.custom==='review')return reviewUI(a);
 const val=state[s.id]||'';
 a.innerHTML=`<label class="main">${s.q}</label>${s.textarea?`<textarea id="v">${esc(val)}</textarea>`:`<input id="v" value="${esc(val)}" autocomplete="off">`}<div class="help">${s.help||''}</div>${navButtons()}`;
 document.getElementById('v')?.focus();
}
function inicioUI(a){a.innerHTML=`<label class="main">Vamos montar seu currículo?</label><div class="note">Você não precisa informar CPF, RG ou dados bancários. O endereço completo é opcional. Revise tudo antes de usar o currículo.</div><div class="consent"><input type="checkbox" id="consent"><label for="consent">Concordo em fornecer os dados apenas para gerar meu currículo e li o <a class="privacy" href="/privacidade" target="_blank">aviso de privacidade</a>.</label></div><div class="actions"><button class="btn primary" onclick="start()">Começar</button></div>`}
function start(){if(!document.getElementById('consent').checked){alert('Marque a opção de concordância para continuar.');return}idx++;render()}
function next(){const s=steps[idx],v=document.getElementById('v')?.value.trim()||'';if(s.req&&!v){alert('Preencha esta informação.');return}if(s.id==='habilidades'){state.habilidades=v.split(',').map(x=>x.trim()).filter(Boolean)}else{state[s.id]=v}idx++;render()}
function back(){idx=Math.max(1,idx-1);render()}
function formacaoUI(a){a.innerHTML=`<label class="main">Vamos cadastrar sua formação escolar ou acadêmica.</label><div class="row"><input id="f_tipo" placeholder="Tipo: Ensino Médio, Graduação..."><input id="f_curso" placeholder="Curso (se houver)"></div><input id="f_inst" placeholder="Instituição" style="margin-top:10px"><div class="row" style="margin-top:10px"><input id="f_status" placeholder="Concluído / Cursando"><input id="f_ano" placeholder="Ano"></div><div class="count">Formações cadastradas: ${state.formacao.length}</div><div class="actions"><button class="btn secondary" onclick="back()">Voltar</button><button class="btn secondary" onclick="addFormacao()">Adicionar formação</button><button class="btn primary" onclick="finishFormacao()">Continuar</button></div>`}
function addFormacao(){const o={tipo:f_tipo.value.trim(),curso:f_curso.value.trim(),instituicao:f_inst.value.trim(),status:f_status.value.trim(),ano:f_ano.value.trim()};if(!o.tipo&&!o.curso&&!o.instituicao){alert('Informe ao menos o tipo de formação, curso ou instituição.');return false}state.formacao.push(o);render();return true}
function finishFormacao(){if(!state.formacao.length){if(!addFormacao())return}else{idx++;render()}}
function cursosUI(a){a.innerHTML=`<label class="main">Você possui cursos, certificados ou capacitações?</label><input id="c_nome" placeholder="Nome do curso"><input id="c_inst" placeholder="Instituição (opcional)" style="margin-top:10px"><input id="c_ano" placeholder="Ano (opcional)" style="margin-top:10px"><div class="count">Cursos cadastrados: ${state.cursos.length}</div><div class="help">Se não possuir cursos, apenas toque em Continuar.</div><div class="actions"><button class="btn secondary" onclick="back()">Voltar</button><button class="btn secondary" onclick="addCurso()">Adicionar curso</button><button class="btn primary" onclick="idx++;render()">Continuar</button></div>`}
function addCurso(){const o={nome:c_nome.value.trim(),instituicao:c_inst.value.trim(),ano:c_ano.value.trim()};if(!o.nome){alert('Informe o nome do curso.');return}state.cursos.push(o);render()}
function expUI(a){a.innerHTML=`<label class="main">Você já teve emprego, estágio, trabalho informal, voluntariado ou projeto relevante?</label><select id="e_tipo"><option>Emprego</option><option>Estágio</option><option>Trabalho informal</option><option>Voluntariado</option><option>Projeto</option></select><input id="e_emp" placeholder="Empresa, escola, instituição ou local" style="margin-top:10px"><input id="e_cargo" placeholder="Cargo/função" style="margin-top:10px"><input id="e_periodo" placeholder="Período (ex.: 2025-2026)" style="margin-top:10px"><textarea id="e_ativ" placeholder="Conte, de forma simples, o que você fazia." style="margin-top:10px"></textarea><div class="count">Experiências cadastradas: ${state.experiencias.length}</div><div class="help">Se nunca teve experiência, apenas toque em Continuar.</div><div class="actions"><button class="btn secondary" onclick="back()">Voltar</button><button class="btn secondary" onclick="addExp()">Adicionar experiência</button><button class="btn primary" onclick="idx++;render()">Continuar</button></div>`}
function addExp(){const o={tipo:e_tipo.value,empresa:e_emp.value.trim(),cargo:e_cargo.value.trim(),periodo:e_periodo.value.trim(),atividades:e_ativ.value.trim()};if(!o.empresa&&!o.cargo&&!o.atividades){alert('Informe ao menos uma informação sobre a experiência.');return}state.experiencias.push(o);render()}
function section(title,html){return `<div class="review-section"><div class="review-title">${title}</div><div class="review-item">${html||'Não informado'}</div></div>`}
function reviewUI(a){const form=state.formacao.map(x=>[x.tipo,x.curso,x.instituicao,x.status,x.ano].filter(Boolean).map(esc).join(' - ')).join('<br>');const cursos=state.cursos.map(x=>[x.nome,x.instituicao,x.ano].filter(Boolean).map(esc).join(' - ')).join('<br>');const exps=state.experiencias.map(x=>[x.tipo,x.empresa,x.cargo,x.periodo,x.atividades].filter(Boolean).map(esc).join(' - ')).join('<br>');a.innerHTML=`<label class="main">Confira suas informações.</label>${section('Contato',`${esc(state.nome_completo)}<br>${esc(state.cidade_uf)}<br>${esc(state.telefone)}${state.email?'<br>'+esc(state.email):''}`)}${section('Objetivo profissional',esc(state.cargo_objetivo))}${section('Formação',form)}${section('Cursos',cursos)}${section('Experiências',exps)}${section('Habilidades',state.habilidades.map(esc).join(', '))}<div class="help">Se precisar corrigir algo, use Voltar. Ao gerar, o arquivo será entregue em Word.</div><div class="actions"><button class="btn secondary" onclick="back()">Voltar</button><button class="btn primary" id="gen" onclick="generate()">Gerar currículo Word</button></div><div class="spinner" id="spin">Gerando seu currículo...</div>`}
async function generate(){const btn=document.getElementById('gen'),spin=document.getElementById('spin');btn.disabled=true;spin.style.display='block';try{const r=await fetch('/gerar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:state})});if(!r.ok){let msg='Não foi possível gerar o currículo.';try{const j=await r.json();msg=j.detail||msg}catch{}throw new Error(msg)}const b=await r.blob();const cd=r.headers.get('content-disposition')||'';let filename='curriculo.docx';const m=cd.match(/filename="?([^";]+)"?/i);if(m)filename=m[1];const link=document.createElement('a');const url=URL.createObjectURL(b);link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);spin.innerHTML='✓ Currículo gerado. Verifique seus downloads.'}catch(e){alert(e.message);spin.style.display='none'}finally{btn.disabled=false}}
render();
</script></body></html>
